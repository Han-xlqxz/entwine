<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entwine - Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F2F2F7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .logo {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 40px;
        }
        input {
            width: 280px;
            padding: 16px 20px;
            border: 2px solid #E5E5EA;
            border-radius: 12px;
            font-size: 17px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            -webkit-appearance: none;
        }
        button {
            width: 280px;
            padding: 16px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            -webkit-appearance: none;
        }
        button:active {
            background: #0056CC;
        }
        .error {
            color: #FF3B30;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .success {
            color: #34C759;
            font-size: 18px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="logo">Entwine</div>
    <input type="password" id="pwd" placeholder="请输入密码" maxlength="20">
    <button onclick="login()">进入</button>
    <div class="error" id="error">密码错误</div>
    <div class="success" id="success">登录成功！</div>

    <script>
        function login() {
            var pwd = document.getElementById('pwd').value;
            if (pwd === 'Hanxlqxzyfz') {
                document.getElementById('error').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                alert('登录成功！密码正确。');
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('success').style.display = 'none';
            }
        }
    </script>
</body>
</html>
