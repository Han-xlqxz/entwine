<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entwine</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f2f2f7;
      color: #1f1f1f;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    #app {
      width: 100%;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #f9f9fb;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0,0,0,0.03);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      background: #f9f9fb;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    #lockScreen {
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 214, 222, 0.12), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
    }

    .splash-card {
      width: 82%;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      letter-spacing: 5px;
      font-weight: 500;
      margin: 0 0 10px;
      color: #222222;
    }

    .subtitle {
      color: #8e8e93;
      letter-spacing: 3px;
      margin: 0 0 60px;
      font-size: 14px;
    }

    .login-box input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #d1d1d6;
      background: transparent;
      text-align: center;
      padding: 12px 10px;
      outline: none;
      color: #333333;
      font-size: 14px;
    }

    .login-box button {
      margin-top: 24px;
      width: 100%;
      padding: 12px 0;
      border-radius: 16px;
      background: #ffffff;
      color: #1f1f1f;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      font-size: 14px;
    }

    .tip {
      font-size: 12px;
      color: #b08a8a;
      margin-top: 10px;
      min-height: 16px;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(249,249,251,0.96);
      border-bottom: 1px solid rgba(0,0,0,0.04);
      flex-shrink: 0;
    }

    .topbar-center {
      font-size: 16px;
      font-weight: 500;
    }

    .icon-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #1f1f1f;
    }

    .search-bar {
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }

    .search-bar input {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: #ffffff;
      padding: 9px 12px;
      outline: none;
      color: #333333;
      font-size: 14px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px 90px;
      background: #f9f9fb;
    }

    .settings-content {
      padding-top: 4px;
    }

    .section-title {
      margin: 16px 8px 7px;
      color: #8e8e93;
      font-size: 12px;
      font-weight: 400;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .friend-item,
    .card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      border-radius: 16px;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }

    .card {
      padding: 13px 14px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .card.danger {
      color: #d9534f;
    }

    .group-card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      margin-bottom: 4px;
    }

    .group-item {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      background: #ffffff;
      font-size: 14px;
    }

    .group-item:last-child {
      border-bottom: none;
    }

    .group-item.danger {
      color: #d9534f;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f2f2f7;
      color: #6e6e73;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 14px;
      flex-shrink: 0;
    }

    .friend-meta {
      flex: 1;
    }

    .friend-name {
      font-size: 15px;
      font-weight: 500;
    }

    .friend-preview {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      color: #a1a1a6;
      margin-top: 80px;
      line-height: 1.8;
      font-size: 13px;
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #f9f9fb;
    }

    .page.active {
      display: flex;
    }

    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      background: rgba(255,255,255,0.98);
      border-top: 1px solid rgba(0,0,0,0.05);
      z-index: 20;
    }

    .tab {
      flex: 1;
      color: #9a9aa0;
      font-size: 12px;
    }

    .tab.active {
      color: #1f1f1f;
      font-weight: 500;
    }

    .chat-topbar {
      min-height: 60px;
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 10px;
      padding-right: 10px;
      background: rgba(249,249,251,0.98);
      border-bottom: 1px solid rgba(0,0,0,0.04);
      flex-shrink: 0;
    }

    .chat-topbar .icon-btn {
      position: static;
      transform: none;
    }

    .chat-user-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.03);
      padding: 6px 9px;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      max-width: 220px;
    }

    .mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f2f2f7;
      color: #6e6e73;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .chat-user-meta {
      min-width: 0;
    }

    .chat-user-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-user-status {
      font-size: 10px;
      color: #8e8e93;
      margin-top: 1px;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 224, 230, 0.06), transparent 26%),
        #f9f9fb;
    }

    .msg-row {
      display: flex;
      margin-bottom: 10px;
    }

    .msg-row.me {
      justify-content: flex-end;
    }

    .msg-bubble {
      max-width: 76%;
      padding: 9px 11px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      line-height: 1.5;
      font-size: 14px;
    }

    .msg-row.me .msg-bubble {
      background: #eceff3;
    }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
      background: rgba(249,249,251,0.98);
      border-top: 1px solid rgba(0,0,0,0.04);
      flex-shrink: 0;
    }

    .chat-footer input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 16px;
      background: #ffffff;
      padding: 10px 11px;
      font-size: 14px;
    }

    .round-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
    }

    .send-btn {
      padding: 9px 12px;
      border-radius: 16px;
      background: #1f1f1f;
      color: #ffffff;
      font-size: 13px;
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.16);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      width: 86%;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .modal-card h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .modal-card input,
    .modal-card textarea {
      width: 100%;
      border: none;
      outline: none;
      background: #f7f7f9;
      border-radius: 14px;
      padding: 11px;
      resize: none;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .modal-actions button {
      padding: 8px 12px;
      border-radius: 14px;
      background: #f2f2f7;
      font-size: 13px;
    }

    .modal-actions button:last-child {
      background: #e9e9ee;
    }

    .popover-mask {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 60;
    }

    .popover-mask.active {
      display: block;
    }

    .chat-popover,
    .plus-popover {
      position: absolute;
      right: 12px;
      width: 168px;
      background: rgba(255,255,255,0.96);
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .chat-popover {
      top: calc(60px + env(safe-area-inset-top));
    }

    .plus-popover {
      bottom: calc(66px + env(safe-area-inset-bottom));
      left: 12px;
      right: auto;
    }

    .popover-item {
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      color: #1f1f1f;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      font-size: 14px;
    }

    .popover-item:last-child {
      border-bottom: none;
    }

    .popover-item:active {
      background: #f7f7f9;
    }

    .popover-item.muted {
      color: #8e8e93;
    }

    .sub-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
    }

    .small-btn {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 14px;
      background: #ffffff;
      margin-top: 8px;
      font-size: 13px;
    }

    .moment-item {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
      border-radius: 16px;
      padding: 13px 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
    }

    .moment-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .moment-name {
      font-size: 14px;
      font-weight: 500;
    }

    .moment-mood {
      font-size: 11px;
      color: #8e8e93;
      margin-top: 2px;
    }

    .moment-text {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .moment-actions {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      color: #8e8e93;
      font-size: 12px;
    }

    .diary-profile {
      text-align: center;
      padding: 16px 0 10px;
    }

    .diary-avatar {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #6e6e73;
    }

    .diary-name {
      font-size: 18px;
      font-weight: 600;
    }

    .diary-id {
      color: #8e8e93;
      margin-top: 4px;
      font-size: 13px;
    }

    .diary-stats {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 16px;
      color: #8e8e93;
      font-size: 12px;
    }

    .diary-item {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
      border-radius: 16px;
      padding: 13px 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
    }

    .diary-text {
      font-size: 14px;
      line-height: 1.6;
    }

    .diary-date {
      margin-top: 8px;
      font-size: 11px;
      color: #8e8e93;
    }

    .diary-actions {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      color: #8e8e93;
      font-size: 12px;
    }

    .comment-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.04);
    }

    .comment-item {
      font-size: 12px;
      color: #6e6e73;
      margin-bottom: 6px;
    }

    @media (min-width: 700px) {
      #app {
        max-width: 560px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="lockScreen" class="screen active">
      <div class="splash-card">
        <h1 class="logo">Entwine</h1>
        <p class="subtitle">我 们 的 宇 宙</p>
        <div class="login-box">
          <input id="passwordInput" type="password" placeholder="请输入密码" />
          <button id="unlockBtn">进入</button>
          <p id="lockTip" class="tip"></p>
        </div>
      </div>
    </section>

    <section id="mainApp" class="screen">
      <div class="page active" id="page-messages">
        <header class="topbar">
          <div class="topbar-center" id="messageTitle">消息</div>
          <button class="icon-btn topbar-right" id="addFriendBtn">＋</button>
        </header>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜索" />
        </div>
        <main class="content">
          <div id="friendList" class="list"></div>
          <div id="emptyState" class="empty">还没有好友，点击右上角添加。</div>
        </main>
      </div>

      <div class="page" id="page-settings">
        <header class="topbar">
          <div class="topbar-center">设置</div>
        </header>
        <main class="content settings-content">
          <div class="section-title">全局设置</div>
          <div class="group-card">
            <div class="group-item" data-action="global-cards">全局字卡</div>
            <div class="group-item" data-action="global-emoji">全局表情</div>
            <div class="group-item" data-action="global-pat">全局拍一拍</div>
            <div class="group-item" data-action="reply-manage">回复管理</div>
            <div class="group-item" data-action="mood-book">心事簿</div>
          </div>

          <div class="section-title">外观</div>
          <div class="group-card">
            <div class="group-item" data-action="appearance">外观设置</div>
          </div>

          <div class="section-title">我的信箱</div>
          <div class="group-card">
            <div class="group-item" data-action="letters">见字如面</div>
          </div>

          <div class="section-title">数据管理</div>
          <div class="group-card">
            <div class="group-item" data-action="backup-all">备份全部数据</div>
            <div class="group-item" data-action="backup-chat">备份聊天记录</div>
            <div class="group-item danger" data-action="reset-all">重置所有数据</div>
          </div>
        </main>
      </div>

      <div class="page" id="page-moments">
        <header class="topbar">
          <div class="topbar-center">朋友圈</div>
          <button class="icon-btn topbar-right" id="myProfileBtn">我</button>
        </header>
        <main class="content">
          <div id="momentsList" class="list"></div>
          <div id="momentsEmpty" class="empty">朋友还没有发布内容。</div>
        </main>
      </div>

      <div class="page" id="page-diary">
        <header class="topbar">
          <div class="topbar-center">日记</div>
          <button class="icon-btn topbar-right" id="writeDiaryBtn">✎</button>
        </header>
        <main class="content">
          <div class="diary-profile">
            <div class="diary-avatar">我</div>
            <div class="diary-name">我的名字</div>
            <div class="diary-id">@my_id</div>
            <button class="small-btn" id="editDiaryProfileBtn">编辑资料</button>
            <div class="diary-stats">
              <span id="diaryCount">0 篇日记</span>
              <span id="diaryLikes">0 个被喜欢</span>
            </div>
          </div>
          <div id="diaryList" class="list"></div>
          <div id="diaryEmpty" class="empty">还没有发布日记。</div>
        </main>
      </div>

      <nav class="tabbar">
        <button class="tab active" data-page="messages">消息</button>
        <button class="tab" data-page="settings">设置</button>
        <button class="tab" data-page="moments">朋友圈</button>
        <button class="tab" data-page="diary">日记</button>
      </nav>
    </section>

    <section id="chatScreen" class="screen">
      <header class="chat-topbar">
        <button class="icon-btn" id="backToMessages">‹</button>
        <div class="chat-user-pill">
          <div class="mini-avatar" id="chatAvatar">友</div>
          <div class="chat-user-meta">
            <div class="chat-user-name" id="chatName">好友</div>
            <div class="chat-user-status" id="chatStatus">正在输入…</div>
          </div>
        </div>
        <button class="icon-btn" id="chatMenuBtn">…</button>
      </header>
      <main class="chat-body" id="chatBody"></main>
      <footer class="chat-footer">
        <button class="round-btn" id="plusBtn">＋</button>
        <input type="text" id="chatInput" placeholder="输入消息…" />
        <button class="send-btn" id="sendBtn">发送</button>
      </footer>
    </section>

    <div class="popover-mask" id="chatMenuModal">
      <div class="chat-popover">
        <button class="popover-item" data-chat-menu="cards">聊天设置</button>
        <button class="popover-item" data-chat-menu="advanced">高级设置</button>
        <button class="popover-item" data-chat-menu="beautify">美化</button>
        <button class="popover-item" data-chat-menu="archive">存档</button>
        <button class="popover-item muted" id="closeChatMenuBtn">取消</button>
      </div>
    </div>

    <div class="popover-mask" id="plusMenuModal">
      <div class="plus-popover">
        <button class="popover-item" data-plus="camera">图片</button>
        <button class="popover-item" data-plus="emoji">表情</button>
        <button class="popover-item" data-plus="draw">抽一张字卡</button>
        <button class="popover-item muted" id="closePlusMenuBtn">取消</button>
      </div>
    </div>

    <div class="modal" id="friendModal">
      <div class="modal-card">
        <h3>添加好友</h3>
        <input type="text" id="friendNameInput" placeholder="输入好友备注" />
        <div class="modal-actions">
          <button id="cancelFriendBtn">取消</button>
          <button id="saveFriendBtn">添加</button>
        </div>
      </div>
    </div>

    <div class="modal" id="cardModal">
      <div class="modal-card">
        <h3 id="cardModalTitle">导入字卡</h3>
        <textarea id="cardInput" rows="6" placeholder="在此输入，每行一条"></textarea>
        <p class="tip" id="cardCountTip">共 0 条</p>
        <div class="modal-actions">
          <button id="cancelCardBtn">取消</button>
          <button id="saveCardBtn">添加</button>
        </div>
      </div>
    </div>

    <section id="subScreen" class="screen">
      <header class="chat-topbar">
        <button class="icon-btn" id="backFromSub">‹</button>
        <div class="sub-title" id="subTitle">页面</div>
      </header>
      <main class="content" id="subContent"></main>
    </section>
  </div>

  <script>
    const PASSWORD = "Hanxlqxzyfz";
    const STORAGE_KEY = "entwine_single_v1";

    const state = {
      unlocked: false,
      friends: [],
      activeFriendId: null,
      moments: [
        {
          name: "示例好友",
          mood: "今天心情不错",
          text: "这是朋友圈的示例内容。",
          likes: 2,
          favorites: 1,
          comments: ["示例评论一", "示例评论二"],
        }
      ],
      diaries: [
        {
          text: "这是日记的示例内容。",
          time: Date.now(),
          likes: 1,
          favorites: 0,
          comments: ["示例小纸条"],
        }
      ],
      profile: {
        diaryName: "我的名字",
        diaryId: "@my_id",
      },
      lastMainPage: "messages",
    };

    const els = {
      lockScreen: document.getElementById("lockScreen"),
      mainApp: document.getElementById("mainApp"),
      chatScreen: document.getElementById("chatScreen"),
      subScreen: document.getElementById("subScreen"),
      passwordInput: document.getElementById("passwordInput"),
      unlockBtn: document.getElementById("unlockBtn"),
      lockTip: document.getElementById("lockTip"),
      tabs: document.querySelectorAll(".tab"),
      pages: document.querySelectorAll(".page"),
      addFriendBtn: document.getElementById("addFriendBtn"),
      friendModal: document.getElementById("friendModal"),
      friendNameInput: document.getElementById("friendNameInput"),
      cancelFriendBtn: document.getElementById("cancelFriendBtn"),
      saveFriendBtn: document.getElementById("saveFriendBtn"),
      friendList: document.getElementById("friendList"),
      emptyState: document.getElementById("emptyState"),
      messageTitle: document.getElementById("messageTitle"),
      searchInput: document.getElementById("searchInput"),
      backToMessages: document.getElementById("backToMessages"),
      chatAvatar: document.getElementById("chatAvatar"),
      chatName: document.getElementById("chatName"),
      chatStatus: document.getElementById("chatStatus"),
      chatBody: document.getElementById("chatBody"),
      chatInput: document.getElementById("chatInput"),
      sendBtn: document.getElementById("sendBtn"),
      plusBtn: document.getElementById("plusBtn"),
      chatMenuBtn: document.getElementById("chatMenuBtn"),
      chatMenuModal: document.getElementById("chatMenuModal"),
      closeChatMenuBtn: document.getElementById("closeChatMenuBtn"),
      plusMenuModal: document.getElementById("plusMenuModal"),
      closePlusMenuBtn: document.getElementById("closePlusMenuBtn"),
      cardModal: document.getElementById("cardModal"),
      cardModalTitle: document.getElementById("cardModalTitle"),
      cardInput: document.getElementById("cardInput"),
      cardCountTip: document.getElementById("cardCountTip"),
      cancelCardBtn: document.getElementById("cancelCardBtn"),
      saveCardBtn: document.getElementById("saveCardBtn"),
      backFromSub: document.getElementById("backFromSub"),
      subTitle: document.getElementById("subTitle"),
      subContent: document.getElementById("subContent"),
      momentsList: document.getElementById("momentsList"),
      momentsEmpty: document.getElementById("momentsEmpty"),
      myProfileBtn: document.getElementById("myProfileBtn"),
      diaryList: document.getElementById("diaryList"),
      diaryEmpty: document.getElementById("diaryEmpty"),
      writeDiaryBtn: document.getElementById("writeDiaryBtn"),
      editDiaryProfileBtn: document.getElementById("editDiaryProfileBtn"),
      diaryCount: document.getElementById("diaryCount"),
      diaryLikes: document.getElementById("diaryLikes"),
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          state.unlocked = !!saved.unlocked;
          state.friends = saved.friends || [];
          state.moments = saved.moments || state.moments;
          state.diaries = saved.diaries || state.diaries;
          state.profile = saved.profile || state.profile;
          state.lastMainPage = saved.lastMainPage || "messages";
        }
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showScreen(name) {
      [els.lockScreen, els.mainApp, els.chatScreen, els.subScreen].forEach(s => s.classList.remove("active"));
      if (name === "lock") els.lockScreen.classList.add("active");
      if (name === "main") els.mainApp.classList.add("active");
      if (name === "chat") els.chatScreen.classList.add("active");
      if (name === "sub") els.subScreen.classList.add("active");
    }

    function switchPage(pageName) {
      state.lastMainPage = pageName;
      saveState();
      els.pages.forEach(p => p.classList.remove("active"));
      document.getElementById(`page-${pageName}`)?.classList.add("active");
      els.tabs.forEach(t => t.classList.toggle("active", t.dataset.page === pageName));
    }

    function openModal(el) { el.classList.add("active"); }
    function closeModal(el) { el.classList.remove("active"); }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getActiveFriend() {
      return state.friends.find(f => f.id === state.activeFriendId);
    }

    function renderFriends(filter = "") {
      els.friendList.innerHTML = "";
      const unread = state.friends.reduce((sum, f) => sum + (f.unread || 0), 0);
      els.messageTitle.textContent = unread > 0 ? `消息(${unread})` : "消息";

      const keyword = filter.trim().toLowerCase();
      const filteredFriends = state.friends.filter(friend => {
        if (!keyword) return true;
        const nameMatch = friend.name.toLowerCase().includes(keyword);
        const msgMatch = (friend.messages || []).some(m => m.text.toLowerCase().includes(keyword));
        return nameMatch || msgMatch;
      });

      if (!filteredFriends.length) {
        els.emptyState.style.display = "block";
        els.emptyState.textContent = keyword ? "没有找到相关好友或聊天记录。" : "还没有好友，点击右上角添加。";
        return;
      }

      els.emptyState.style.display = "none";

      filteredFriends.forEach(friend => {
        const item = document.createElement("div");
        item.className = "friend-item";
        item.innerHTML = `
          <div class="avatar">${friend.name.slice(0, 1)}</div>
          <div class="friend-meta">
            <div class="friend-name">${escapeHtml(friend.name)}</div>
            <div class="friend-preview">${friend.messages?.length ? escapeHtml(friend.messages[friend.messages.length - 1].text) : "暂无消息"}</div>
          </div>
        `;
        item.onclick = () => openChat(friend.id);
        els.friendList.appendChild(item);
      });
    }

    function openChat(friendId) {
      const friend = state.friends.find(f => f.id === friendId);
      if (!friend) return;
      state.activeFriendId = friendId;
      friend.unread = 0;
      saveState();
      renderFriends(els.searchInput.value);

      els.chatName.textContent = friend.name;
      els.chatAvatar.textContent = friend.name.slice(0, 1);
      els.chatStatus.textContent = "正在输入…";
      renderMessages(friend);
      showScreen("chat");
    }

    function renderMessages(friend) {
      els.chatBody.innerHTML = "";
      (friend.messages || []).forEach(msg => appendMessage(msg.text, msg.from === "me"));
      scrollChatToBottom();
    }

    function appendMessage(text, isMe = false) {
      const row = document.createElement("div");
      row.className = `msg-row ${isMe ? "me" : ""}`;
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
      els.chatBody.appendChild(row);
      scrollChatToBottom();
    }

    function scrollChatToBottom() {
      els.chatBody.scrollTop = els.chatBody.scrollHeight;
    }

    function sendMyMessage() {
      const text = els.chatInput.value.trim();
      if (!text) return;
      const friend = getActiveFriend();
      if (!friend) return;

      friend.messages = friend.messages || [];
      friend.messages.push({ from: "me", text, time: Date.now() });
      els.chatInput.value = "";
      saveState();
      appendMessage(text, true);
      renderFriends(els.searchInput.value);
    }

    function drawCardFromFriend() {
      const friend = getActiveFriend();
      if (!friend) return;

      const cards = [
        ...(friend.cards || []),
        ...(state.globalCards || [])
      ];

      if (!cards.length) {
        appendMessage("（还没有字卡）", false);
        return;
      }

      const text = cards[Math.floor(Math.random() * cards.length)];
      friend.messages = friend.messages || [];
      friend.messages.push({ from: "friend", text, time: Date.now() });
      saveState();
      appendMessage(text, false);
      renderFriends(els.searchInput.value);
    }

    function addFriend() {
      const name = els.friendNameInput.value.trim();
      if (!name) return;

      state.friends.push({
        id: Date.now().toString(),
        name,
        unread: 0,
        cards: [],
        messages: [],
        settings: {},
      });

      els.friendNameInput.value = "";
      closeModal(els.friendModal);
      saveState();
      renderFriends(els.searchInput.value);
    }

    function updateCardCountTip() {
      const lines = els.cardInput.value.split("\n").map(v => v.trim()).filter(Boolean);
      els.cardCountTip.textContent = `共 ${lines.length} 条`;
    }

    function openCardModal(title = "导入字卡") {
      els.cardModalTitle.textContent = title;
      els.cardInput.value = "";
      updateCardCountTip();
      openModal(els.cardModal);
    }

    function saveCards() {
      const friend = getActiveFriend();
      if (!friend) return;
      const lines = els.cardInput.value.split("\n").map(v => v.trim()).filter(Boolean);
      friend.cards = friend.cards || [];
      friend.cards.push(...lines);
      els.cardInput.value = "";
      updateCardCountTip();
      closeModal(els.cardModal);
      saveState();
    }

    function renderMoments() {
      els.momentsList.innerHTML = "";
      if (!state.moments.length) {
        els.momentsEmpty.style.display = "block";
        return;
      }
      els.momentsEmpty.style.display = "none";

      state.moments.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "moment-item";
        div.innerHTML = `
          <div class="moment-header">
            <div class="avatar">${(item.name || "友").slice(0, 1)}</div>
            <div>
              <div class="moment-name">${escapeHtml(item.name || "好友")}</div>
              <div class="moment-mood">${escapeHtml(item.mood || "")}</div>
            </div>
          </div>
          <div class="moment-text">${escapeHtml(item.text || "")}</div>
          <div class="moment-actions">
            <span>点赞 ${item.likes || 0}</span>
            <span>评论 ${(item.comments || []).length}</span>
            <span>收藏 ${item.favorites || 0}</span>
          </div>
        `;
        div.onclick = () => openMomentDetail(index);
        els.momentsList.appendChild(div);
      });
    }

    function openMomentDetail(index) {
      const item = state.moments[index];
      if (!item) return;
      const comments = (item.comments || []).map(c => `<div class="comment-item">${escapeHtml(c)}</div>`).join("");
      openSubPage("朋友圈详情", `
        <div class="moment-item">
          <div class="moment-header">
            <div class="avatar">${(item.name || "友").slice(0, 1)}</div>
            <div>
              <div class="moment-name">${escapeHtml(item.name || "好友")}</div>
              <div class="moment-mood">${escapeHtml(item.mood || "")}</div>
            </div>
          </div>
          <div class="moment-text">${escapeHtml(item.text || "")}</div>
          <div class="moment-actions">
            <span>点赞 ${item.likes || 0}</span>
            <span>评论 ${(item.comments || []).length}</span>
            <span>收藏 ${item.favorites || 0}</span>
          </div>
          <div class="comment-box">
            <div class="section-title">评论区</div>
            ${comments || `<div class="comment-item">暂无评论</div>`}
          </div>
        </div>
      `);
    }

    function renderDiaries() {
      els.diaryList.innerHTML = "";
      els.diaryCount.textContent = `${state.diaries.length} 篇日记`;
      els.diaryLikes.textContent = `${state.diaries.reduce((sum, d) => sum + (d.likes || 0), 0)} 个被喜欢`;

      document.querySelector(".diary-name").textContent = state.profile.diaryName || "我的名字";
      document.querySelector(".diary-id").textContent = state.profile.diaryId || "@my_id";

      if (!state.diaries.length) {
        els.diaryEmpty.style.display = "block";
        return;
      }
      els.diaryEmpty.style.display = "none";

      state.diaries.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "diary-item";
        div.innerHTML = `
          <div class="diary-text">${escapeHtml(item.text || "")}</div>
          <div class="diary-date">${new Date(item.time || Date.now()).toLocaleDateString()}</div>
          <div class="diary-actions">
            <span>喜欢 ${item.likes || 0}</span>
            <span>小纸条 ${(item.comments || []).length}</span>
            <span>收藏 ${item.favorites || 0}</span>
          </div>
        `;
        div.onclick = () => openDiaryDetail(index);
        els.diaryList.appendChild(div);
      });
    }

    function openDiaryDetail(index) {
      const item = state.diaries[index];
      if (!item) return;
      const comments = (item.comments || []).map(c => `<div class="comment-item">${escapeHtml(c)}</div>`).join("");
      openSubPage("日记详情", `
        <div class="diary-item">
          <div class="diary-text">${escapeHtml(item.text || "")}</div>
          <div class="diary-date">${new Date(item.time || Date.now()).toLocaleDateString()}</div>
          <div class="diary-actions">
            <span>喜欢 ${item.likes || 0}</span>
            <span>小纸条 ${(item.comments || []).length}</span>
            <span>收藏 ${item.favorites || 0}</span>
          </div>
          <div class="comment-box">
            <div class="section-title">评论区</div>
            ${comments || `<div class="comment-item">暂无评论</div>`}
          </div>
        </div>
      `);
    }

    function openSubPage(title, html) {
      els.subTitle.textContent = title;
      els.subContent.innerHTML = html;
      showScreen("sub");
    }

    function openChatSubPage(type) {
      const friend = getActiveFriend();
      if (!friend) return;

      if (type === "cards") {
        openSubPage("聊天设置", `
          <div class="card">字卡</div>
          <div class="card">Emoji</div>
          <div class="card">拍一拍</div>
          <div class="card">拼字</div>
          <div class="section-title">当前字卡</div>
          <div class="card">${(friend.cards || []).map(escapeHtml).join("<br>") || "暂无字卡"}</div>
          <button class="send-btn" id="subAddCardBtn">添加字卡</button>
        `);
        setTimeout(() => {
          document.getElementById("subAddCardBtn")?.addEventListener("click", () => openCardModal("导入字卡"));
        }, 0);
      }

      if (type === "advanced") {
        openSubPage("高级设置", `
          <div class="card">引用回复</div>
          <div class="card">已读回执</div>
          <div class="card">日期显示</div>
          <div class="card">正在输入</div>
          <div class="card">主动发信息</div>
          <div class="card">回复节奏</div>
        `);
      }

      if (type === "beautify") {
        openSubPage("美化", `
          <div class="card">更换聊天背景</div>
          <div class="card">字体大小</div>
          <div class="card">气泡大小</div>
          <div class="card">头像大小</div>
          <div class="card">导入气泡文件</div>
          <div class="card">输入 CSS</div>
        `);
      }

      if (type === "archive") {
        openSubPage("存档", `
          <div class="card">备份当前聊天记录</div>
          <div class="card danger">删除聊天</div>
        `);
      }
    }

    function bindEvents() {
      els.unlockBtn.onclick = () => {
        if (els.passwordInput.value === PASSWORD) {
          state.unlocked = true;
          saveState();
          showScreen("main");
          switchPage(state.lastMainPage || "messages");
          renderFriends();
          renderMoments();
          renderDiaries();
        } else {
          els.lockTip.textContent = "密码不正确";
        }
      };

      els.tabs.forEach(tab => tab.onclick = () => switchPage(tab.dataset.page));

      els.addFriendBtn.onclick = () => openModal(els.friendModal);
      els.cancelFriendBtn.onclick = () => closeModal(els.friendModal);
      els.saveFriendBtn.onclick = addFriend;

      els.backToMessages.onclick = () => {
        state.activeFriendId = null;
        showScreen("main");
        switchPage("messages");
        renderFriends(els.searchInput.value);
      };

      els.sendBtn.onclick = sendMyMessage;

      els.chatInput.addEventListener("keydown", e => {
        if (e.key === "Enter") sendMyMessage();
      });

      els.plusBtn.onclick = () => openModal(els.plusMenuModal);
      els.closePlusMenuBtn.onclick = () => closeModal(els.plusMenuModal);

      document.querySelectorAll("[data-plus]").forEach(btn => {
        btn.onclick = () => {
          const action = btn.dataset.plus;
          closeModal(els.plusMenuModal);
          if (action === "draw") drawCardFromFriend();
          if (action === "emoji") appendMessage("（表情功能后续开放）", true);
          if (action === "camera") appendMessage("（图片功能后续开放）", true);
        };
      });

      els.chatMenuBtn.onclick = () => openModal(els.chatMenuModal);
      els.closeChatMenuBtn.onclick = () => closeModal(els.chatMenuModal);

      document.querySelectorAll("[data-chat-menu]").forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.chatMenu;
          closeModal(els.chatMenuModal);
          openChatSubPage(type);
        };
      });

      els.backFromSub.onclick = () => {
        showScreen("main");
        switchPage(state.lastMainPage || "messages");
        renderFriends();
        renderMoments();
        renderDiaries();
      };

      els.cancelCardBtn.onclick = () => closeModal(els.cardModal);
      els.saveCardBtn.onclick = saveCards;
      els.cardInput.addEventListener("input", updateCardCountTip);

      els.searchInput.addEventListener("input", () => {
        renderFriends(els.searchInput.value);
      });

      document.querySelectorAll("[data-action]").forEach(card => {
        card.onclick = () => {
          const action = card.dataset.action;
          if (action === "global-cards") openSubPage("全局字卡", `<div class="card">后续这里管理全局字卡</div>`);
          if (action === "global-emoji") openSubPage("全局表情", `<div class="card">后续这里管理全局表情</div>`);
          if (action === "global-pat") openSubPage("全局拍一拍", `<div class="card">后续这里管理全局拍一拍</div>`);
          if (action === "reply-manage") openSubPage("回复管理", `<div class="card">后续这里管理朋友圈和日记回复</div>`);
          if (action === "mood-book") openSubPage("心事簿", `<div class="card">后续这里管理心情和日记字卡</div>`);
          if (action === "appearance") openSubPage("外观设置", `<div class="card">后续这里做全局外观</div>`);
          if (action === "letters") openSubPage("见字如面", `<div class="card">后续这里做信箱</div>`);
          if (action === "backup-all") openSubPage("备份全部数据", `<div class="card">后续这里做备份</div>`);
          if (action === "backup-chat") openSubPage("备份聊天记录", `<div class="card">后续这里做聊天记录备份</div>`);
          if (action === "reset-all") openSubPage("重置所有数据", `<div class="card danger">后续这里做三次确认重置</div>`);
        };
      });

      els.writeDiaryBtn.onclick = () => {
        const text = prompt("输入日记内容");
        if (!text) return;
        state.diaries.push({
          text,
          time: Date.now(),
          likes: 0,
          favorites: 0,
          comments: [],
        });
        saveState();
        renderDiaries();
      };

      els.myProfileBtn.onclick = () => {
        openSubPage("我的主页", `
          <div class="diary-profile">
            <div class="diary-avatar">我</div>
            <div class="diary-name">${escapeHtml(state.profile.diaryName || "我的名字")}</div>
            <div class="diary-id">${escapeHtml(state.profile.diaryId || "@my_id")}</div>
            <button class="small-btn" id="editProfileFromMomentBtn">编辑主页</button>
          </div>
          <div class="card">后续这里显示我发布的动态</div>
        `);
        setTimeout(() => {
          document.getElementById("editProfileFromMomentBtn")?.addEventListener("click", () => {
            openSubPage("编辑主页", `
              <div class="card">头像</div>
              <div class="card">名字</div>
              <div class="card">ID</div>
              <div class="card">个性签名</div>
              <div class="card">地区</div>
              <div class="card">状态</div>
            `);
          });
        }, 0);
      };

      els.editDiaryProfileBtn.onclick = () => {
        openSubPage("编辑资料", `
          <div class="card">头像</div>
          <div class="card">背景图</div>
          <div class="card">名字</div>
          <div class="card">ID</div>
          <div class="card">地区</div>
        `);
      };
    }

    function init() {
      loadState();
      bindEvents();

      if (state.unlocked) {
        showScreen("main");
        switchPage(state.lastMainPage || "messages");
        renderFriends();
        renderMoments();
        renderDiaries();
      } else {
        showScreen("lock");
      }
    }

    init();
  </script>
</body>
</html>
